<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODIVO — Преміум Каталог</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --bg2: #111118;
            --card: #16161f;
            --border: rgba(255,255,255,0.07);
            --accent: #7c5cfc;
            --accent2: #fc5c7d;
            --text: #f0f0f5;
            --muted: #6b6b80;
            --glass: rgba(255,255,255,0.04);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background blobs */
        body::before {
            content: '';
            position: fixed;
            top: -200px; left: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(124,92,252,0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -200px; right: -200px;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(252,92,125,0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* NAV */
        nav {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px;
            height: 72px;
            background: rgba(10,10,15,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-size: 24px; font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-search {
            display: flex; align-items: center; gap: 10px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 10px 20px;
            width: 320px;
            transition: border-color 0.3s;
        }
        .nav-search:focus-within { border-color: var(--accent); }
        .nav-search input {
            background: none; border: none; outline: none;
            color: var(--text); font-family: 'Outfit', sans-serif;
            font-size: 14px; width: 100%;
        }
        .nav-search input::placeholder { color: var(--muted); }
        .nav-search svg { color: var(--muted); flex-shrink: 0; }

        .nav-actions { display: flex; align-items: center; gap: 16px; }

        .nav-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 14px; font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { border-color: var(--accent); background: rgba(124,92,252,0.1); }

        .cart-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none; color: white;
            position: relative;
        }
        .cart-btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,92,252,0.4); }

        .cart-badge {
            position: absolute; top: -6px; right: -6px;
            background: var(--accent2); color: white;
            width: 20px; height: 20px; border-radius: 50%;
            font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }

        /* HERO */
        .hero {
            position: relative; z-index: 1;
            padding: 80px 40px 60px;
            text-align: center;
        }

        .hero-tag {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px;
            background: rgba(124,92,252,0.15);
            border: 1px solid rgba(124,92,252,0.3);
            border-radius: 50px;
            font-size: 13px; font-weight: 500; color: #a78bfa;
            margin-bottom: 24px;
        }
        .hero-tag::before { content: ''; width: 8px; height: 8px; background: #7c5cfc; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }

        .hero h1 {
            font-size: clamp(40px, 6vw, 72px);
            font-weight: 900; line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 16px;
        }
        .hero h1 span {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p { font-size: 18px; color: var(--muted); font-weight: 300; }

        /* FILTERS */
        .filters {
            position: relative; z-index: 1;
            padding: 0 40px 40px;
            display: flex; align-items: center; gap: 12px;
            flex-wrap: wrap;
        }

        .filter-label { font-size: 13px; color: var(--muted); font-weight: 500; margin-right: 4px; }

        .filter-btn {
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--muted);
            font-family: 'Outfit', sans-serif;
            font-size: 13px; font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: var(--accent); color: var(--text); }
        .filter-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-color: transparent; color: white;
        }

        /* GRID */
        .catalog {
            position: relative; z-index: 1;
            padding: 0 40px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* PRODUCT CARD */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            position: relative;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(124,92,252,0.3);
            box-shadow: 0 32px 64px rgba(0,0,0,0.4), 0 0 0 1px rgba(124,92,252,0.1);
        }

        .card-img {
            width: 100%; aspect-ratio: 1;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }
        .card:hover .card-img { transform: scale(1.05); }

        .card-img-placeholder {
            width: 100%; aspect-ratio: 1;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex; align-items: center; justify-content: center;
            font-size: 64px;
        }

        .card-badge {
            position: absolute; top: 16px; left: 16px;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase;
        }
        .badge-new { background: rgba(124,92,252,0.9); color: white; }
        .badge-sale { background: rgba(252,92,125,0.9); color: white; }
        .badge-hot { background: rgba(255,165,0,0.9); color: white; }

        .card-wish {
            position: absolute; top: 16px; right: 16px;
            width: 36px; height: 36px;
            background: rgba(10,10,15,0.7);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border);
            transition: all 0.2s;
            opacity: 0;
        }
        .card:hover .card-wish { opacity: 1; }
        .card-wish:hover { background: rgba(252,92,125,0.2); border-color: var(--accent2); }
        .card-wish svg { width: 16px; height: 16px; color: var(--text); }

        .card-body { padding: 20px; }

        .card-brand {
            font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .card-name {
            font-size: 16px; font-weight: 600;
            color: var(--text); margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .card-category { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

        .card-sizes {
            display: flex; gap: 6px; flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .size-tag {
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 11px; font-weight: 500; color: var(--muted);
            transition: all 0.2s;
        }
        .size-tag:hover { border-color: var(--accent); color: var(--text); }
        .size-tag.out { opacity: 0.3; text-decoration: line-through; cursor: not-allowed; }

        .card-footer { display: flex; align-items: center; justify-content: space-between; }

        .card-price {
            display: flex; flex-direction: column;
        }
        .price-old {
            font-size: 12px; color: var(--muted);
            text-decoration: line-through;
        }
        .price-current {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .add-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .add-btn:hover { transform: scale(1.1); box-shadow: 0 8px 24px rgba(124,92,252,0.5); }
        .add-btn:active { transform: scale(0.95); }
        .add-btn svg { width: 20px; height: 20px; }

        /* STATS BAR */
        .stats-bar {
            position: relative; z-index: 1;
            display: flex; justify-content: center; gap: 60px;
            padding: 40px;
            margin: 0 40px 60px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(10px);
        }
        .stat { text-align: center; }
        .stat-num {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label { font-size: 13px; color: var(--muted); margin-top: 4px; }

        /* TOAST */
        .toast {
            position: fixed; bottom: 32px; right: 32px; z-index: 999;
            padding: 16px 24px;
            background: var(--card);
            border: 1px solid rgba(124,92,252,0.3);
            border-radius: 16px;
            font-size: 14px; font-weight: 500;
            display: flex; align-items: center; gap: 10px;
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 50%; display:flex;align-items:center;justify-content:center; }
    </style>
</head>
<body>

<!-- NAV -->
<nav>
    <div class="nav-logo">MODIVO</div>
    <div class="nav-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Пошук товарів..." id="searchInput" oninput="filterProducts()">
    </div>
    <div class="nav-actions">
        <button class="nav-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Увійти
        </button>
        <button class="nav-btn cart-btn" onclick="showToast('🛒 Кошик поки порожній!')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            Кошик
            <span class="cart-badge" id="cartCount">0</span>
        </button>
    </div>
</nav>

<!-- HERO -->
<div class="hero">
    <div class="hero-tag">🔥 Нова колекція 2026</div>
    <h1>Каталог <span>преміум</span><br>взуття та одягу</h1>
    <p>Понад 1,200 товарів від провідних світових брендів</p>
</div>

<!-- STATS -->
<div class="stats-bar">
    <div class="stat"><div class="stat-num">1,200+</div><div class="stat-label">Товарів</div></div>
    <div class="stat"><div class="stat-num">48</div><div class="stat-label">Брендів</div></div>
    <div class="stat"><div class="stat-num">12K+</div><div class="stat-label">Клієнтів</div></div>
    <div class="stat"><div class="stat-num">4.9★</div><div class="stat-label">Рейтинг</div></div>
</div>

<!-- FILTERS -->
<div class="filters">
    <span class="filter-label">Категорія:</span>
    <button class="filter-btn active" onclick="setFilter(this,'all')">Всі</button>
    <button class="filter-btn" onclick="setFilter(this,'nike')">Nike</button>
    <button class="filter-btn" onclick="setFilter(this,'adidas')">Adidas</button>
    <button class="filter-btn" onclick="setFilter(this,'nb')">New Balance</button>
    <button class="filter-btn" onclick="setFilter(this,'puma')">Puma</button>
    <button class="filter-btn" onclick="setFilter(this,'sale')">🔥 Знижки</button>
</div>

<!-- CATALOG -->
<div class="catalog" id="catalog"></div>

<!-- TOAST -->
<div class="toast" id="toast">
    <div class="toast-icon">✓</div>
    <span id="toastMsg">Товар додано до кошика!</span>
</div>

<script>
const products = [
    { id:1, brand:'Nike', name:'Air Max 270 React', category:'Кросівки', price:4299, oldPrice:5499, badge:'sale', brand_key:'nike', emoji:'👟', sizes:['39','40','41','42','43'], stock:[3,0,5,2,1] },
    { id:2, brand:'Adidas', name:'Ultraboost 23', category:'Бігові', price:5999, oldPrice:null, badge:'new', brand_key:'adidas', emoji:'🏃', sizes:['38','39','40','41','42'], stock:[2,4,0,6,3] },
    { id:3, brand:'New Balance', name:'990v5 Made in USA', category:'Lifestyle', price:7499, oldPrice:8999, badge:'hot', brand_key:'nb', emoji:'⚡', sizes:['40','41','42','43','44'], stock:[1,3,5,0,2] },
    { id:4, brand:'Nike', name:'Jordan 1 Retro High', category:'Баскетбол', price:6299, oldPrice:null, badge:'new', brand_key:'nike', emoji:'🏀', sizes:['40','41','42','43'], stock:[4,2,6,1] },
    { id:5, brand:'Puma', name:'RS-X³ Puzzle', category:'Lifestyle', price:3199, oldPrice:3999, badge:'sale', brand_key:'puma', emoji:'🎯', sizes:['38','39','40','41','42','43'], stock:[2,3,0,4,1,5] },
    { id:6, brand:'Adidas', name:'Yeezy 350 V2', category:'Lifestyle', price:9999, oldPrice:11499, badge:'hot', brand_key:'adidas', emoji:'🔥', sizes:['39','40','41','42'], stock:[1,2,3,0] },
    { id:7, brand:'New Balance', name:'574 Core', category:'Lifestyle', price:2899, oldPrice:null, badge:'new', brand_key:'nb', emoji:'✨', sizes:['38','39','40','41','42','43'], stock:[5,4,3,2,1,6] },
    { id:8, brand:'Nike', name:'Dunk Low Retro', category:'Skateboard', price:4599, oldPrice:5299, badge:'sale', brand_key:'nike', emoji:'🛹', sizes:['39','40','41','42','43'], stock:[3,0,2,4,1] },
];

let activeFilter = 'all';
let cartCount = 0;

function setFilter(btn, filter) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = filter;
    filterProducts();
}

function filterProducts() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = products.filter(p => {
        const matchFilter = activeFilter === 'all' || p.brand_key === activeFilter || (activeFilter === 'sale' && p.oldPrice);
        const matchSearch = p.name.toLowerCase().includes(search) || p.brand.toLowerCase().includes(search);
        return matchFilter && matchSearch;
    });
    renderProducts(filtered);
}

function renderProducts(list) {
    const catalog = document.getElementById('catalog');
    if (list.length === 0) {
        catalog.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:80px;color:#6b6b80;font-size:18px;">😔 Товарів не знайдено</div>';
        return;
    }
    catalog.innerHTML = list.map(p => `
        <div class="card" id="card-${p.id}">
            <div class="card-img-placeholder">${p.emoji}</div>
            ${p.badge ? `<div class="card-badge badge-${p.badge}">${p.badge === 'new' ? 'Новинка' : p.badge === 'sale' ? '-' + Math.round((1 - p.price/p.oldPrice)*100) + '%' : 'Хіт'}</div>` : ''}
            <div class="card-wish" onclick="wishlist(event, ${p.id})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
            <div class="card-body">
                <div class="card-brand">${p.brand}</div>
                <div class="card-name">${p.name}</div>
                <div class="card-category">${p.category}</div>
                <div class="card-sizes">
                    ${p.sizes.map((s,i) => `<div class="size-tag${p.stock[i] === 0 ? ' out' : ''}">${s}</div>`).join('')}
                </div>
                <div class="card-footer">
                    <div class="card-price">
                        ${p.oldPrice ? `<span class="price-old">${p.oldPrice.toLocaleString()} ₴</span>` : ''}
                        <span class="price-current">${p.price.toLocaleString()} ₴</span>
                    </div>
                    <button class="add-btn" onclick="addToCart(event, ${p.id}, '${p.name}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
            </div>
        </div>
    `).join('');
}

function addToCart(e, id, name) {
    e.stopPropagation();
    cartCount++;
    document.getElementById('cartCount').textContent = cartCount;
    showToast(`✅ "${name}" додано до кошика!`);
}

function wishlist(e, id) {
    e.stopPropagation();
    showToast('❤️ Додано до улюблених!');
}

let toastTimer;
function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

renderProducts(products);
</script>
</body>
</html>
